<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Tuck Shop POS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="toast-container"></div>
<script>window.isOwner = false;</script>
<span sec:authorize="hasRole('OWNER')"><script>window.isOwner = true;</script></span>
<div class="app-shell">
  <div th:replace="~{fragments/nav :: sidebar(active='products')}"></div>

  <div class="main">
    <div class="page-header">
      <div>
        <h1>Inventory</h1>
        <div class="subtitle">Add products, set prices, and track stock</div>
      </div>
      <button class="btn btn-primary btn-lg" onclick="openAddModal()" sec:authorize="hasRole('OWNER')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Add product
      </button>
    </div>

    <div class="card badge-warn" style="padding:12px 16px; margin-bottom:16px; display:flex; align-items:center; gap:8px;" sec:authorize="hasRole('CASHIER')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span>You can view stock here. Ask the owner to add, edit, or delete products.</span>
    </div>

    <div class="card" style="margin-bottom: 20px;">
      <input id="product-search" type="text" placeholder="Search by name or barcode...">
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Barcode</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="product-rows"></tbody>
      </table>
      <div id="products-empty" class="empty-state" style="display:none;">No products yet. Add your first product.</div>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/products.js}"></script>
</body>
</html>
