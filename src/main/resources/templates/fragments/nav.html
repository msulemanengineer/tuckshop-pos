<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="sidebar(active)" class="sidebar">
  <div class="brand">
    <span class="dot"></span>
    <span>Tuck Shop POS</span>
  </div>

  <a href="/" class="nav-link" th:classappend="${active == 'dashboard'} ? 'active' : ''">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    <span>Dashboard</span>
  </a>

  <a href="/pos" class="nav-link" th:classappend="${active == 'pos'} ? 'active' : ''">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 6v12M9 6v12M13 6v12M16 6v12"/></svg>
    <span>Billing</span>
  </a>

  <a href="/products" class="nav-link" th:classappend="${active == 'products'} ? 'active' : ''">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
    <span>Inventory</span>
  </a>

  <a href="/khata" class="nav-link" th:classappend="${active == 'khata'} ? 'active' : ''">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>Khata (credit)</span>
  </a>

  <a href="/sales" class="nav-link" th:classappend="${active == 'sales'} ? 'active' : ''">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l3 3v17H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
    <span>Sales history</span>
  </a>

  <div sec:authorize="hasRole('OWNER')">
    <a href="/reports" class="nav-link" th:classappend="${active == 'reports'} ? 'active' : ''">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg>
      <span>Reports</span>
    </a>
    <a href="/sale-edits" class="nav-link" th:classappend="${active == 'sale-edits'} ? 'active' : ''">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      <span>Edited sales</span>
    </a>
    <a href="/users" class="nav-link" th:classappend="${active == 'users'} ? 'active' : ''">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Staff accounts</span>
    </a>
    <a href="/backups" class="nav-link" th:classappend="${active == 'backups'} ? 'active' : ''">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
      <span>Backups</span>
    </a>
    <a href="/license" class="nav-link" th:classappend="${active == 'license'} ? 'active' : ''">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>
      <span>License</span>
    </a>
  </div>

  <div style="margin-top:auto; padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.08);">
    <div style="font-size:13px; color:rgba(255,255,255,0.55); margin-bottom:10px;">
      Signed in as <strong style="color:#fff;" sec:authentication="name">user</strong>
    </div>
    <form method="post" th:action="@{/logout}">
      <button type="submit" class="btn" style="width:100%; background:rgba(255,255,255,0.08); color:#fff; font-size:14px; padding:10px;">
        Sign out
      </button>
    </form>
  </div>
</div>
</body>
</html>
