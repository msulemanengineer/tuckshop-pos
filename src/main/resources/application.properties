# Server
server.port=8080
server.address=0.0.0.0

# App name shown in logs
spring.application.name=Tuck Shop POS

# H2 file database - stored on disk, survives restarts, zero install needed
spring.datasource.url=jdbc:h2:file:./data/tuckshop;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console (optional, for viewing raw data if needed) -> http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf - disable caching in dev, Spring Boot auto-enables cache in prod packaging
spring.thymeleaf.cache=false

# Currency / shop settings
shop.name=Highway Tuck Shop
shop.currency=Rs

# Backups - a daily snapshot of the whole database (sales, stock, khata ledger) is written
# here automatically. Owner can also trigger one manually and download it from the
# Backups page. Old backups beyond "keep" are deleted automatically.
backup.dir=data/backups
backup.keep=30
backup.cron=0 0 3 * * *

# License gate - CHANGE license.secret before handing this build to a client, and keep
# your copy of it private. Only someone with this exact value can issue a valid renewal
# key for this install's Device ID (see LicenseKeyGeneratorTool). New sales pause once
# the license expires; nothing else is blocked or hidden - existing data stays visible.
license.secret=W8C1SICRL9HQOT9L8NVN9QSVKTSG
license.trial-days=30
